name: Update Dashboard Data

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. These run every 30 minutes from 8:05 AM through
    # 11:35 PM in Asia/Manila, plus a final 12:05 AM run.
    # Avoiding the top of the hour makes GitHub scheduled runs less likely to lag.
    - cron: '5,35 0-15 * * *'
    - cron: '5 16 * * *'

concurrency:
  group: update-dashboard-data
  cancel-in-progress: true

jobs:
  update-dashboard-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      deployments: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install exact YouTube view counter
        run: |
          python -m pip install --user --upgrade yt-dlp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build fresh dashboard data
        run: node scripts/update-dashboard-data.mjs

      - name: Commit dashboard data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/dashboard.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dashboard data unchanged."
            exit 0
          fi

          cp data/dashboard.json /tmp/dashboard.json

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/dashboard.json data/dashboard.json

            if git diff --quiet -- data/dashboard.json; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Dashboard data already matches latest main."
              exit 0
            fi

            git add data/dashboard.json
            git commit -m "Update live dashboard data $(TZ=Asia/Manila date '+%Y-%m-%d %H:%M')"

            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Dashboard data push attempt $attempt failed; retrying on latest main."
            sleep $((attempt * 5))
          done

          echo "Dashboard data push failed after all retry attempts."
          exit 1

      - name: Verify generated data
        run: |
          node -e 'const fs = require("fs"); const data = JSON.parse(fs.readFileSync("data/dashboard.json", "utf8")); if (!data.source?.fullCommentRows) throw new Error("Missing comment count"); if (!data.overview?.benguetEntry?.currentViews) throw new Error("Missing Benguet views"); if ((data.rankings?.global || []).length < 100) throw new Error("Global ranking is unexpectedly short"); console.log(JSON.stringify({ generatedAt: data.generatedAt, comments: data.source.fullCommentRows, benguetViews: data.overview.benguetEntry.currentViews, globalRows: data.rankings.global.length }, null, 2));'

      - name: Deploy Cloudflare Pages
        continue-on-error: true
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$RAW_CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured; skipping explicit Pages deploy."
            exit 0
          fi

          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\r\n[:space:]')"
          npx --yes wrangler@latest pages deploy . \
            --project-name=incmv-live-dashboard \
            --branch=main \
            --account-id=1adbe6308690a1d3ce7fb732fa17e859

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not configured; skipping Slack notification."
            exit 0
          fi

          if [ -f data/dashboard.json ]; then
            SUMMARY="$(node -e 'const fs = require("fs"); const data = JSON.parse(fs.readFileSync("data/dashboard.json", "utf8")); process.stdout.write(`Website dashboard update ${process.env.JOB_STATUS}. Updated: ${data.generatedAt}. Comments: ${data.source.fullCommentRows}. Benguet views: ${data.overview.benguetEntry.currentViews}.`)')"
          else
            SUMMARY="Website dashboard update ${JOB_STATUS}. data/dashboard.json was not generated."
          fi
          SUMMARY="$SUMMARY" node -e 'fetch(process.env.SLACK_WEBHOOK_URL, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text: process.env.SUMMARY }) }).then((response) => { if (!response.ok) throw new Error(`Slack webhook failed: ${response.status}`); })'

name: Update Dashboard Data

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. This is hourly from 8 AM through 12 MN in Asia/Manila.
    - cron: '0 0-16 * * *'

concurrency:
  group: update-dashboard-data
  cancel-in-progress: false

jobs:
  update-dashboard-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      deployments: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build fresh dashboard data
        run: node scripts/update-dashboard-data.mjs

      - name: Commit dashboard data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/dashboard.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dashboard data unchanged."
            exit 0
          fi

          git add data/dashboard.json
          git commit -m "Update live dashboard data $(TZ=Asia/Manila date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            if git push; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Dashboard data push failed after $attempt attempts."
              exit 1
            fi

            git pull --rebase origin main
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify generated data
        run: |
          node -e 'const fs = require("fs"); const data = JSON.parse(fs.readFileSync("data/dashboard.json", "utf8")); if (!data.source?.fullCommentRows) throw new Error("Missing comment count"); if (!data.overview?.benguetEntry?.currentViews) throw new Error("Missing Benguet views"); if ((data.rankings?.global || []).length < 100) throw new Error("Global ranking is unexpectedly short"); console.log(JSON.stringify({ generatedAt: data.generatedAt, comments: data.source.fullCommentRows, benguetViews: data.overview.benguetEntry.currentViews, globalRows: data.rankings.global.length }, null, 2));'

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not configured; skipping Slack notification."
            exit 0
          fi

          if [ -f data/dashboard.json ]; then
            SUMMARY="$(node -e 'const fs = require("fs"); const data = JSON.parse(fs.readFileSync("data/dashboard.json", "utf8")); process.stdout.write(`Website dashboard update ${process.env.JOB_STATUS}. Updated: ${data.generatedAt}. Comments: ${data.source.fullCommentRows}. Benguet views: ${data.overview.benguetEntry.currentViews}.`)')"
          else
            SUMMARY="Website dashboard update ${JOB_STATUS}. data/dashboard.json was not generated."
          fi
          SUMMARY="$SUMMARY" node -e 'fetch(process.env.SLACK_WEBHOOK_URL, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text: process.env.SUMMARY }) }).then((response) => { if (!response.ok) throw new Error(`Slack webhook failed: ${response.status}`); })'
